
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academia Digital</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #081629;
      color: white;
      text-align: center;
    }
    header {
      padding: 25px;
      background: #101f38;
      border-bottom: 2px solid #d4af37;
    }
    h1 { color: #d4af37; }
    main { padding: 50px 20px; }
    .botao {
      display: inline-block;
      background: #d4af37;
      color: #081629;
      padding: 15px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>ACADEMIA DIGITAL</h1>
    <p>Seu futuro começa aqui</p>
  </header>

  <main>
    <h2>Aprenda no seu ritmo</h2>
    <p>Cursos online com aulas gravadas.</p>
    <a class="botao" href="#cursos">Ver cursos</a>
    <section id="cursos">
      <h2>Nossos cursos</h2>
      <p>Em breve, nossos cursos estarão aqui.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./supabase.js"></script>

 <div id="teste-supabase" style="text-align:center; padding:20px; color:#e0b52e;">
      Verificando conexão...
      </div>
      
      <script>
      (async function () {
        const resultado = document.getElementById("teste-supabase");
        
          if (typeof supabaseClient === "undefined") {
              resultado.textContent = "❌ Supabase não inicializado";
                  return;
                    }
                    
                      try {
                          const { data, error } = await supabaseClient
                                .from("courses")
                                      .select("id")
                                            .limit(1);
                                            
                                                if (error) {
                                                      resultado.textContent = "❌ Erro: " + error.message;
                                                          } else {
                                                                resultado.textContent = "✅ Supabase conectado! Consulta realizada.";
                                                                    }
                                                                      } catch (erro) {
                                                                          resultado.textContent = "❌ Erro: " + erro.message;
                                                                            }
                                                                            })();
                                                                            </script>
                                                                             !== "undefined") {
        console.log("Supabase conectado!");
          } else {
              console.error("Erro ao conectar Supabase.");
                }
                </script>
                
  
</body>
</html>
